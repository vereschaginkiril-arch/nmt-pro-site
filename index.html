<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Освітній простір</title>
  <script src="https://telegram.org"></script>
  <style>
    :root{--bg:#0b1020;--p:#151f34;--p2:#1d2a45;--line:#2c3c5b;--t:#f3f6ff;--m:#aab8d2;--a:#8997ff;--g:#54d8b2}
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(ellipse at 10% 0,#202d50,transparent 38%),var(--bg);color:var(--t);font:16px/1.55 system-ui,-apple-system,sans-serif}
    .app{max-width:1160px;margin:auto;padding:16px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
    .brand{display:flex;gap:12px;align-items:center}
    .logo{background:linear-gradient(135deg,#788cff,#b06cf5);border-radius:15px;padding:9px;font-size:25px}
    .brand h1{font-size:19px;margin:0}
    .muted,small{color:var(--m)}
    button,input,select{font:inherit}
    button{cursor:pointer;transition:.2s}
    .pro,.primary{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#788aff,#a16df2);color:white;font-weight:750}
    .pro:hover,.primary:hover{opacity:.92}
    .pro.active{background:linear-gradient(135deg,#1b9d7d,#51d4ac)}
    .hero{padding:27px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(115deg,#202e51,#17243c);margin-bottom:20px}
    .hero h2{font-size:clamp(26px,5vw,40px);line-height:1.15;margin:8px 0}
    .hero p{color:var(--m);max-width:700px}
    .eyebrow{color:#b5c0ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
    .heading{display:flex;justify-content:space-between;align-items:end;margin:23px 0 12px}
    .heading h2{margin:0}
    .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .card,.topic,.panel{background:var(--p);border:1px solid var(--line);border-radius:19px}
    .card{padding:16px;text-align:left;color:var(--t)}
    .card b{font-size:28px;display:block}
    .card:hover,.topic:hover{border-color:var(--a);transform:translateY(-2px)}
    .nmt{width:100%;margin-top:13px;padding:20px;border:1px solid #6558bb;border-radius:20px;background:linear-gradient(110deg,#30265f,#1b2948);color:white;text-align:left}
    .nmt strong{font-size:20px}
    .nmt small{display:block;margin-top:4px}
    .back{border:1px solid var(--line);background:var(--p);color:var(--t);padding:9px 13px;border-radius:12px}
    .crumb{margin:10px 0;color:var(--m)}
    .crumb button{background:none;border:0;color:#b9c5ff;padding:0}
    .subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
    .subject{padding:18px;text-align:left;color:var(--t)}
    .subject strong{display:block;font-size:18px}
    .topiclist{display:grid;gap:9px}
    .topic{width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--t)}
    .tag{font-size:11px;padding:4px 10px;border-radius:30px;background:#203e39;color:#78e8c5;white-space:nowrap}
    .lock{background:#49372b;color:#ffd18b}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
    .tab{border:1px solid var(--line);background:var(--p);color:var(--m);padding:10px 13px;border-radius:12px}
    .tab.active{background:#2a365f;border-color:var(--a);color:white}
    .panel{padding:20px;margin:12px 0}
    .rule{padding:12px;margin:9px 0;background:var(--p2);border-left:3px solid var(--a);border-radius:0 12px 12px 0}
    .question{padding:14px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#101a2d}
    .question h4{margin:0 0 9px}
    .opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#1a2741;color:white}
    .opt.correct{background:#174438;border-color:#35c99c}
    .opt.wrong{background:#482632;border-color:#ff7d91}
    .opt:disabled{opacity:1;cursor:default}
    .modalwrap{position:fixed;inset:0;background:#050916e6;display:grid;place-items:center;padding:18px;z-index:10}
    .modal{width:min(440px,100%);padding:26px;border-radius:22px;background:#151f34;border:1px solid #354668;box-shadow:0 20px 50px rgba(0,0,0,.5)}
    .modal h2{margin:0 0 10px;font-size:22px;line-height:1.3}
    .modal input{width:100%;padding:13px 14px;margin:14px 0;background:#0b1020;color:white;border:1px solid var(--line);border-radius:12px;font-size:16px}
    .modal input:focus{outline:none;border-color:var(--a)}
    .err{color:#ff7d91;font-size:14px;margin-top:8px;min-height:20px}
    .hidden{display:none!important}
    .footer{text-align:center;color:#7584a0;font-size:12px;margin:35px 0}
    @media(max-width:700px){
      .grid{grid-template-columns:repeat(2,1fr)}
      .subjects{grid-template-columns:1fr}
      .top{align-items:flex-start}
      .brand h1{font-size:16px}
      .pro{font-size:12px;padding:9px 12px}
      .hero{padding:20px}
      .panel{padding:14px}
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="logo">🎓</div>
        <div>
          <h1>Освітній простір</h1>
          <small>Твоя онлайн-школа знань</small>
        </div>
      </div>
      <button id="pro" class="pro">🔑 Активувати PRO</button>
    </header>
    <main id="main"></main>
    <div class="footer">Освітній простір · Вчися, досліджуй, відкривай нове</div>
  </div>
  <div id="modal" class="hidden"></div>

  <script>
  (() => {
    const API_URL = "https://school-nmt-bot.onrender.com";

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('#0b1020'); } catch (e) {}
    }

    const $ = s => document.querySelector(s);
    const esc = s => String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[c]));

    const icons = {
      'Українська мова': '📘',
      'Українська література': '📚',
      'Алгебра': '📐',
      'Геометрія': '📏',
      'Історія України': '🏛️',
      'Англійська мова': '🌍',
      'Біологія': '🧬',
      'Хімія': '⚗️',
      'Географія': '🌎',
      'Фізика': '⚡',
      'Інформатика': '💻'
    };

    const lesson = (title, desc, rules, qs) => ({ title, desc, rules, qs });
    const Q = (q, a, c) => [q, a, c];

    const bank = {
      'Українська мова': [
        lesson('Звуки й букви', 'Звук — найменша одиниця усного мовлення, буква — знак для позначення звука. Українська абетка має 33 букви.',
          ['Є шість голосних звуків: [а], [о], [у], [е], [и], [і].', 'Приголосні розрізняють за дзвінкістю, глухістю, твердістю та м’якістю.', 'Я, ю, є можуть позначати два звуки на початку слова, після голосного, апострофа або м’якого знака.'],
          [Q('Скільки букв в українській абетці?', ['31', '32', '33'], 2), Q('Скільки голосних звуків?', ['6', '10', '12'], 0), Q('Звук — одиниця', ['усного мовлення', 'письма', 'абзацу'], 0), Q('Яка пара складається з голосних?', ['а, о', 'б, в', 'д, ж'], 0), Q('Яка буква може позначати два звуки?', ['я', 'ь', 'і'], 0)]
        ),
        lesson('Будова слова', 'Слово має значущі частини: корінь, префікс, суфікс і закінчення.',
          ['Корінь — спільна частина споріднених слів.', 'Префікс стоїть перед коренем, суфікс — після кореня.', 'Закінчення змінюється; основа — слово без закінчення.'],
          [Q('Спільна частина споріднених слів —', ['корінь', 'суфікс', 'закінчення'], 0), Q('Префікс у слові «прибігти» —', ['при-', '-біг-', '-ти'], 0), Q('У слові «книги» закінчення —', ['-книг', '-и', '-г'], 1), Q('Споріднене до «ліс» —', ['лісовий', 'лист', 'літо'], 0), Q('Основа — це', ['слово без закінчення', 'лише корінь', 'лише суфікс'], 0)]
        ),
        lesson('Частини мови', 'Самостійні частини мови називають предмети, ознаки, кількість, дії та обставини.',
          ['Іменник: хто? що? Прикметник: який? чий?', 'Дієслово: що робити? Числівник: скільки? котрий?', 'Прислівник відповідає на як? де? коли? Службові слова поєднують слова й речення.'],
          [Q('На питання «що робити?» відповідає', ['дієслово', 'іменник', 'прикметник'], 0), Q('Слово «швидко» — це', ['прислівник', 'прикметник', 'іменник'], 0), Q('На питання «який?» відповідає', ['прикметник', 'числівник', 'дієслово'], 0)]
        )
      ],
      'Алгебра': [
        lesson('Лінійні рівняння', 'Рівняння виду ax = b, де x — змінна, a і b — числа.',
          ['Доданки можна переносити з однієї частини в іншу, змінивши знак на протилежний.', 'Обидві частини рівняння можна помножити або поділити на одне й те саме число, відмінне від нуля.'],
          [Q('Розв’яжіть рівняння: 2x = 10', ['x = 5', 'x = 8', 'x = 20'], 0), Q('Розв’яжіть рівняння: x + 7 = 15', ['x = 22', 'x = 8', 'x = 7'], 1), Q('Розв’яжіть рівняння: 3x - 6 = 0', ['x = -2', 'x = 2', 'x = 3'], 1)]
        )
      ],
      'Історія України': [
        lesson('Київська Русь', 'Середньовічна держава у Східній Європі зі столицею в Києві (IX–XIII ст.).',
          ['882 р. — об’єднання Північної та Південної Русі князем Олегом.', '988 р. — хрещення Русі князем Володимиром Великим.', 'За Ярослава Мудрого укладено перший писемний збірник законів — «Руську правду».'],
          [Q('У якому році відбулося хрещення Русі?', ['882 р.', '988 р.', '1036 р.'], 1), Q('Хто уклав збірник законів «Руська правда»?', ['Олег', 'Святослав', 'Ярослав Мудрий'], 2)]
        )
      ],
      'Англійська мова': [
        lesson('Present Simple', 'Теперішній простий час для регулярних дій, звичок та фактів.',
          ['З займенниками he, she, it до дієслова додається закінчення -s / -es.', 'Для заперечень та запитань використовуються допоміжні дієслова do та does.'],
          [Q('Оберіть правильний варіант: She ___ to school every day.', ['go', 'goes', 'going'], 1), Q('Оберіть правильне заперечення: They ___ like coffee.', ['doesn’t', 'don’t', 'not'], 1)]
        )
      ]
    };
