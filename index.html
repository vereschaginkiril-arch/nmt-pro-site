<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>Освітній простір</title><script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0b1020;--p:#151f34;--p2:#1d2a45;--line:#2c3c5b;--t:#f3f6ff;--m:#aab8d2;--a:#8997ff;--g:#54d8b2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 10% 0,#202d50,transparent 38%),var(--bg);color:var(--t);font:16px/1.55 system-ui}.app{max-width:1160px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{display:flex;gap:12px;align-items:center}.logo{background:linear-gradient(135deg,#788cff,#b06cf5);border-radius:15px;padding:9px;font-size:25px}.brand h1{font-size:19px;margin:0}.muted,small{color:var(--m)}button,input,select{font:inherit}button{cursor:pointer}.pro,.primary{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#788aff,#a16df2);color:white;font-weight:750}.pro.active{background:linear-gradient(135deg,#1b9d7d,#51d4ac)}.hero{padding:27px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(115deg,#202e51,#17243c);margin-bottom:20px}.hero h2{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:8px 0}.hero p{color:var(--m);max-width:700px}.eyebrow{color:#b5c0ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.heading{display:flex;justify-content:space-between;align-items:end;margin:23px 0 12px}.heading h2{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.topic,.panel{background:var(--p);border:1px solid var(--line);border-radius:19px}.card{padding:16px;text-align:left;color:var(--t)}.card b{font-size:28px;display:block}.card:hover,.topic:hover{border-color:var(--a);transform:translateY(-2px)}.nmt{width:100%;margin-top:13px;padding:20px;border:1px solid #6558bb;border-radius:20px;background:linear-gradient(110deg,#30265f,#1b2948);color:white;text-align:left}.nmt strong{font-size:20px}.nmt small{display:block}.back{border:1px solid var(--line);background:var(--p);color:var(--t);padding:9px 13px;border-radius:12px}.crumb{margin:10px 0;color:var(--m)}.crumb button{background:none;border:0;color:#b9c5ff}.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.subject{padding:18px;text-align:left;color:var(--t)}.subject strong{display:block;font-size:18px}.topiclist{display:grid;gap:9px}.topic{width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--t)}.tag{font-size:11px;padding:4px 8px;border-radius:30px;background:#203e39;color:#78e8c5}.lock{background:#49372b;color:#ffd18b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.tab{border:1px solid var(--line);background:var(--p);color:var(--m);padding:10px 13px;border-radius:12px}.tab.active{background:#2a365f;border-color:var(--a);color:white}.panel{padding:20px;margin:12px 0}.rule{padding:12px;margin:9px 0;background:var(--p2);border-left:3px solid var(--a);border-radius:0 12px 12px 0}.question{padding:14px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#101a2d}.question h4{margin:0 0 9px}.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#1a2741;color:white}.opt.correct{background:#174438;border-color:#35c99c}.opt.wrong{background:#482632;border-color:#ff7d91}.opt:disabled{opacity:1}.progress{height:8px;background:#2b3852;border-radius:20px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}.search{width:100%;padding:12px;background:#111c30;color:white;border:1px solid var(--line);border-radius:12px;margin:12px 0}.lab{padding:18px;margin-top:18px;background:#14243a;border:1px solid #36506d;border-radius:20px}.lab select{width:100%;padding:10px;background:#0d192b;color:white;border:1px solid var(--line);border-radius:10px}.labrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stage{height:170px;display:grid;place-items:center;margin:12px 0;border-radius:14px;background:radial-gradient(circle,#294b69,#0b1729)}.beaker{height:110px;width:80px;border:3px solid #a9d6ef;border-top:0;border-radius:4px 4px 20px 20px;position:relative;overflow:hidden}.liquid{position:absolute;bottom:0;width:100%;height:50%;background:#65a9e0aa;transition:.6s}.bubble{position:absolute;bottom:5px;left:20px;width:9px;height:9px;border:1px solid white;border-radius:50%;animation:rise 1.5s infinite}.bubble:nth-child(2){left:48px;animation-delay:.5s}.bubble:nth-child(3){left:35px;animation-delay:1s}@keyframes rise{to{transform:translateY(-100px);opacity:0}}.result{min-height:40px;color:#b9d9ff}.modalwrap{position:fixed;inset:0;background:#050916d9;display:grid;place-items:center;padding:18px;z-index:10}.modal{width:min(440px,100%);padding:22px;border-radius:20px;background:#18243c;border:1px solid #465474}.modal input{width:100%;padding:12px;margin:8px 0;background:#0e1729;color:white;border:1px solid var(--line);border-radius:10px}.hidden{display:none!important}.footer{text-align:center;color:#7584a0;font-size:12px;margin:35px 0}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:16px}.pro{font-size:12px;padding:9px}.hero{padding:20px}.panel{padding:14px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo">🎓</div><div><h1>Освітній простір</h1><small>Твоя онлайн-школа знань</small></div></div><button id="pro" class="pro">🔑 Активувати PRO</button></header><main id="main"></main><div class="footer">Освітній простір · Вчися, досліджуй, відкривай нове</div></div><div id="modal" class="hidden"></div>
<script>
(()=>{
const API_URL = "https://onrender.com";
const tg=window.Telegram?.WebApp;if(tg){tg.ready();tg.expand();try{tg.setHeaderColor('#0b1020')}catch(e){}}
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={'Українська мова':'📘','Українська література':'📚','Алгебра':'📐','Геометрія':'📏','Історія України':'🏛️','Англійська мова':'🌍','Біологія':'🧬','Хімія':'⚗️','Географія':'🌎','Фізика':'⚡','Інформатика':'💻'};
const lesson=(title,desc,rules,qs)=>({title,desc,rules,qs});
const Q=(q,a,c)=>[q,a,c];
const bank={
'Українська мова':[
lesson('Звуки й букви','Звук — найменша одиниця усного мовлення, буква — знак для позначення звука. Українська абетка має 33 букви.',['Є шість голосних звуків: [а], [о], [у], [е], [и], [і].','Приголосні розрізняють за дзвінкістю, глухістю, твердістю та м’якістю.','Я, ю, є можуть позначати два звуки на початку слова, після голосного, апострофа або м’якого знака.'],[Q('Скільки букв в українській абетці?',['31','32','33'],2),Q('Скільки голосних звуків?',['6','10','12'],0),Q('Звук — одиниця',['усного мовлення','письма','абзацу'],0),Q('Яка пара складається з голосних?',['а, о','б, в','д, ж'],0),Q('Яка буква може позначати два звуки?',['я','ь','і'],0)]),
lesson('Будова слова','Слово має значущі частини: корінь, префікс, суфікс і закінчення.',['Корінь — спільна частина споріднених слів.','Префікс стоїть перед коренем, суфікс — після кореня.','Закінчення змінюється; основа — слово без закінчення.'],[Q('Спільна частина споріднених слів —',['корінь','суфікс','закінчення'],0),Q('Префікс у слові «прибігти» —',['при-','-біг-','-ти'],0),Q('У слові «книги» закінчення —',['-книг','-и','-г'],1),Q('Споріднене до «ліс» —',['лісовий','лист','літо'],0),Q('Основа — це',['слово без закінчення','лише корінь','лише суфікс'],0)]),
lesson('Частини мови','Самостійні частини мови називають предмети, ознаки, кількість, дії та обставини.',['Іменник: хто? що? Прикметник: який? чий?','Дієслово: що робити? Числівник: скільки? котрий?','Прислівник відповідає на як? де? коли? Службові слова поєднують слова й речення.'],[Q('На питання «що робити?» відповідає',['дієслово','іменник','прикметник'],0),Q('Слово «швидко» — це',['прислівник','прикметник','займенник'],0),Q('«Під» — це',['прийменник','іменник','дієслово'],0),Q('«Сім» — це',['числівник','прикметник','прислівник'],0),Q('На питання «який?» відповідає',['прикметник','дієслово','сполучник'],0)]),
lesson('Речення та розділові знаки','Речення виражає закінчену думку. За метою висловлювання бувають розповідні, питальні й спонукальні.',['Граматична основа — підмет і присудок.','Питальне речення завершується знаком питання.','Однорідні члени відповідають на одне питання й залежать від одного слова.'],[Q('Граматична основа —',['підмет і присудок','додаток і означення','кома й крапка'],0),Q('Питальне речення завершується',['?','!',';'],0),Q('Однорідні члени відповідають на',['одне питання','різні питання','жодне питання'],0),Q('Розповідне речення',['повідомляє','наказує','запитує'],0),Q('Підмет найчастіше відповідає на',['хто? що?','який?','як?'],0)])],
'Алгебра':[
lesson('Порядок арифметичних дій','У числових виразах важливо дотримуватися порядку виконання дій.',['Спочатку виконують дії в дужках.','Далі множення й ділення зліва направо.','Потім додавання й віднімання зліва направо.'],[Q('Що виконують першим?',['Дії в дужках','Додавання','Множення поза дужками'],0),Q('12 + 3 · 4 =',['24','60','15'],0),Q('(12 + 3) · 4 =',['60','24','19'],0),Q('18 : 3 · 2 =',['12','3','9'],0),Q('2² + 3 =',['7','10','25'],0)]),
lesson('Лінійні рівняння','Лінійне рівняння з однією змінною можна звести до вигляду ax+b=0, де a≠0.',['Переносьте доданки через знак рівності зі зміною знака.','Зведіть подібні доданки й ізолюйте змінну.','Перевірте корінь підстановкою в початкове рівняння.'],[Q('x+8=13. x=',['5','21','−5'],0),Q('4x=28. x=',['7','6','8'],0),Q('2x−6=8. x=',['7','1','4'],0),Q('5−x=2. x=',['3','−3','7'],0),Q('3(x+2)=15. x=',['3','5','7'],0)]),
lesson('Відсотки','Відсоток — одна сота частина числа. p% від a дорівнює a·p/100.',['Щоб знайти відсоток від числа, помножте число на p/100.','Щоб знайти число за його відсотком, поділіть відому частину на p/100.','Збільшення на 20% — множення на 1,2; зменшення на 20% — на 0,8.'],[Q('20% від 150 —',['30','20','45'],0),Q('25% від 80 —',['20','25','40'],0),Q('0,4 у відсотках —',['40%','4%','400%'],0),Q('200 грн знизили на 10%. Нова ціна —',['180','190','220'],0),Q('3/5 у відсотках —',['60%','30%','80%'],0)]),
lesson('Квадратні рівняння','Квадратне рівняння має вигляд ax²+bx+c=0, де a≠0.',['Дискримінант: D=b²−4ac.','Якщо D>0 — два корені; D=0 — один; D<0 — дійсних коренів немає.','За D≥0: x=(-b±√D)/(2a).'],[Q('D для x²−5x+6=0 —',['1','25','−1'],0),Q('Корені x²−5x+6=0 —',['2 і 3','1 і 6','−2 і −3'],0),Q('Якщо D=0, рівняння має',['один корінь','два корені','немає коренів'],0),Q('Знаменник формули коренів —',['2a','a','4ac'],0),Q('x²=9 має корені',['−3 і 3','лише 3','лише −3'],0)])],
'Геометрія':[
lesson('Кути та прямі','Кут утворюють два промені зі спільним початком — вершиною.',['Прямий кут дорівнює 90°, розгорнутий — 180°.','Суміжні кути в сумі дають 180°.','Вертикальні кути рівні.'],[Q('Прямий кут —',['90°','45°','180°'],0),Q('Розгорнутий кут —',['180°','90°','360°'],0),Q('Суміжні кути разом —',['180°','90°','360°'],0),Q('Вертикальні кути',['рівні','завжди 90°','у сумі 180°'],0),Q('До 35° суміжний кут —',['145°','55°','35°'],0)]),
lesson('Трикутники','Трикутник — многокутник із трьома сторонами й трьома кутами.',['Сума внутрішніх кутів трикутника — 180°.','У рівнобедреного трикутника дві рівні сторони й рівні кути при основі.','Теорема Піфагора: c²=a²+b² для прямокутного трикутника.'],[Q('Сума кутів трикутника —',['180°','90°','360°'],0),Q('Кут рівностороннього трикутника —',['60°','90°','45°'],0),Q('Гіпотенуза навпроти',['прямого кута','гострого кута','найменшого кута'],0),Q('Катети 3 і 4: гіпотенуза —',['5','6','7'],0),Q('Рівнобедрений трикутник має',['дві рівні сторони','три різні сторони','два прямі кути'],0)]),
lesson('Площі фігур','Площа вимірює частину площини, обмежену фігурою.',['Прямокутник: S=ab.','Трикутник: S=ah/2; паралелограм: S=ah.','Круг: S=πr².'],[Q('Площа прямокутника 4×6 —',['24','20','10'],0),Q('Трикутник: основа 8, висота 5 —',['20','40','13'],0),Q('Круг радіуса 2 —',['4π','2π','8π'],0),Q('Квадрат зі стороною 7 —',['49','28','14'],0),Q('Одиниця площі —',['см²','см','см³'],0)]),
lesson('Подібність трикутників','Подібні трикутники мають рівні відповідні кути й пропорційні відповідні сторони.',['Коефіцієнт подібності k — відношення відповідних сторін.','Периметри відносяться як k.','Площі подібних фігур відносяться як k².'],[Q('Сторони 3 і 6: k дорівнює',['2','3','6'],0),Q('Якщо k=3, периметр зростає у',['3 рази','6 разів','9 разів'],0),Q('Якщо k=2, площа зростає у',['4 рази','2 рази','8 разів'],0),Q('Подібні трикутники мають відповідні кути',['рівні','удвічі більші','протилежні'],0),Q('Сторони подібних фігур',['пропорційні','завжди рівні','перпендикулярні'],0)])],
'Біологія':[
lesson('Клітина — основа життя','Клітина — найменша структурна й функціональна одиниця живого.',['Мембрана відмежовує клітину й регулює обмін речовин.','Цитоплазма — внутрішнє середовище; ядро еукаріотів зберігає спадкову інформацію.','Хлоропласти здійснюють фотосинтез, мітохондрії беруть участь у клітинному диханні.'],[Q('Що відмежовує клітину?',['Мембрана','Ядро','Рибосома'],0),Q('Де зберігається ДНК еукаріотів?',['У ядрі','У клітинній стінці','У вакуолі'],0),Q('Фотосинтез відбувається у',['хлоропластах','мітохондріях','рибосомах'],0),Q('Клітинне дихання пов’язане з',['мітохондріями','хлоропластами','оболонкою'],0),Q('Цитоплазма — це',['внутрішнє середовище','зовнішній скелет','орган рослини'],0)]),
lesson('Фотосинтез','Фотосинтез — утворення органічних речовин із вуглекислого газу й води за участю світла.',['Відбувається переважно в хлоропластах зелених частин рослин.','Потрібні світло, вода та CO₂; виділяється кисень.','Утворена органічна речовина накопичує енергію.'],[Q('Де фотосинтез?',['У хлоропластах','У мітохондріях','У ядрі'],0),Q('Який газ поглинається?',['CO₂','O₂','N₂'],0),Q('Який газ виділяється?',['Кисень','Азот','Водень'],0),Q('Джерело енергії —',['світло','звук','магнітне поле'],0),Q('Фотосинтез утворює',['органічні речовини','лише воду','мінеральні солі'],0)]),
lesson('Генетика та спадковість','Генетика вивчає спадковість і мінливість. Спадкова інформація записана в молекулах ДНК.',['Ген — ділянка ДНК зі спадковою інформацією.','Алелі — різні форми одного гена.','Генотип — сукупність генів; фенотип — сукупність проявлених ознак.'],[Q('Що вивчає генетика?',['Спадковість і мінливість','Клімат','Рельєф'],0),Q('Носій спадкової інформації —',['ДНК','крохмаль','вода'],0),Q('Ген — ділянка',['ДНК','мембрани','цитоплазми'],0),Q('Фенотип — це',['проявлені ознаки','лише набір генів','тип клітини'],0),Q('Форми одного гена —',['алелі','органели','тканини'],0)]),
lesson('Екосистеми й ланцюги живлення','Екосистема — сукупність організмів і середовища їхнього існування, пов’язаних обміном речовин та енергії.',['Продуценти утворюють органічні речовини, зазвичай це зелені рослини.','Консументи споживають готову органіку; редуценти розкладають рештки.','Енергія передається від одного організму до іншого ланцюгом живлення.'],[Q('Рослини — це',['продуценти','консументи','редуценти'],0),Q('Гриби часто є',['редуцентами','продуцентами','хижаками'],0),Q('Хто є консументом?',['Заєць','Дуб','Водорість'],0),Q('Ланцюг живлення часто починається з',['продуцента','хижака','редуцента'],0),Q('Екосистема включає',['організми й середовище','лише тварин','лише ґрунт'],0)])],
'Хімія':[
lesson('Атоми, молекули й елементи','Атом — найменша електронейтральна частинка хімічного елемента, що зберігає його властивості.',['Ядро атома містить протони й нейтрони; навколо рухаються електрони.','Порядковий номер елемента дорівнює кількості протонів у ядрі.','Молекула складається з атомів, сполучених хімічними зв’язками.'],[Q('Яка частинка має від’ємний заряд?',['Електрон','Протон','Нейтрон'],0),Q('Порядковий номер дорівнює кількості',['протонів','молекул','клітин'],0),Q('Ядро містить',['протони й нейтрони','лише електрони','молекули'],0),Q('Формула води —',['H₂O','CO₂','O₂'],0),Q('Молекула складається з',['атомів','тканин','органів'],0)]),
lesson('Періодична система','Періодична система впорядковує елементи за зростанням заряду ядра атома.',['Горизонтальні рядки — періоди, вертикальні стовпчики — групи.','Елементи однієї групи часто мають подібні хімічні властивості.','Символи елементів — умовні буквені позначення: O, H, Na.'],[Q('Горизонтальний рядок —',['період','група','ізотоп'],0),Q('Вертикальний стовпчик —',['група','період','молекула'],0),Q('Символ Оксигену —',['O','H','C'],0),Q('Символ Натрію —',['Na','N','Ne'],0),Q('Елементи впорядковані за зростанням',['заряду ядра','температури','густини води'],0)]),
lesson('Хімічні реакції та рівняння','Хімічна реакція — перетворення одних речовин на інші. Рівняння відображає реагенти та продукти.',['Маса реагентів дорівнює масі продуктів у замкненій системі.','Під час урівнювання змінюють коефіцієнти, але не індекси формул.','Ознаки реакції: газ, осад, зміна кольору або тепловий ефект.'],[Q('Що змінюють при урівнюванні?',['Коефіцієнти','Індекси','Символи'],0),Q('Маса в замкненій системі',['зберігається','зникає','подвоюється'],0),Q('Ознака реакції —',['виділення газу','зміна шрифту','рух посудини'],0),Q('Індекс 2 у H₂O означає',['два атоми Гідрогену','два атоми Оксигену','дві молекули'],0),Q('Речовини до реакції —',['реагенти','продукти','індикатори'],0)]),
lesson('Кислоти, основи та індикатори','Кислоти й основи — важливі класи речовин. Індикатори змінюють колір залежно від середовища.',['pH<7 — кисле, pH=7 — нейтральне, pH>7 — лужне середовище.','Лакмус у кислому середовищі червоніє, у лужному синіє.','Невідомі речовини не можна куштувати чи змішувати навмання.'],[Q('pH=7 — середовище',['нейтральне','кисле','лужне'],0),Q('Лакмус у кислому середовищі',['червоніє','синіє','зникає'],0),Q('pH=3 — середовище',['кисле','нейтральне','лужне'],0),Q('pH=10 — середовище',['лужне','кисле','нейтральне'],0),Q('Невідомі реактиви потрібно',['не куштувати й дотримуватися безпеки','змішувати навмання','брати руками'],0)])],
'Географія':[
lesson('Карта, масштаб і координати','Карта — зменшене узагальнене зображення земної поверхні за допомогою умовних знаків.',['Масштаб показує, у скільки разів відстані на карті менші за реальні.','Масштаб 1:100 000 означає, що 1 см на карті відповідає 1 км на місцевості.','Паралелі йдуть паралельно екватору, меридіани сполучають полюси.'],[Q('Масштаб показує',['ступінь зменшення','висоту хмар','температуру'],0),Q('1:100 000: 1 см — це',['1 км','100 м','10 км'],0),Q('Паралелі паралельні',['екватору','Гринвічу','осі Землі'],0),Q('Меридіани сполучають',['полюси','материки по екватору','моря'],0),Q('Широту відлічують від',['екватора','Гринвіча','Північного полюса'],0)]),
lesson('Літосфера та рельєф','Літосфера — тверда оболонка Землі, що охоплює земну кору й верхню частину мантії.',['Літосферні плити повільно рухаються.','На межах плит трапляються землетруси, вулканізм і горотворення.','Рельєф — сукупність нерівностей земної поверхні.'],[Q('Літосфера — це',['тверда оболонка','повітряна оболонка','водна оболонка'],0),Q('Рух плит може спричиняти',['землетруси','припливи','вітри'],0),Q('Рельєф — це',['нерівності поверхні','склад повітря','солоність води'],0),Q('Вулканізм пов’язаний із',['земною корою та мантією','атмосферою','гідросферою'],0),Q('Форма рельєфу —',['гори','хмари','течія'],0)]),
lesson('Атмосфера та клімат','Атмосфера — газова оболонка Землі. Погода описує короткочасний стан атмосфери, клімат — багаторічний режим погоди.',['Елементи погоди: температура, тиск, вітер, вологість, опади.','На клімат впливають широта, циркуляція атмосфери, океанічні течії й рельєф.','У тропосфері формуються основні погодні явища.'],[Q('Погода — це стан',['атмосфери за короткий час','клімату за 30 років','лише океану'],0),Q('Клімат — це',['багаторічний режим погоди','погода однієї години','лише опади'],0),Q('Основні погодні явища — у',['тропосфері','стратосфері','екзосфері'],0),Q('Елемент погоди —',['тиск','тип ґрунту','глибина океану'],0),Q('На клімат впливає',['географічна широта','колір будинків','назва країни'],0)]),
lesson('Світовий океан','Світовий океан — безперервна водна оболонка Землі.',['Середня солоність океанічної води близько 35‰.','Океанічні течії переносять тепло й впливають на клімат узбереж.','Припливи пов’язані переважно з гравітаційним впливом Місяця та Сонця.'],[Q('Середня солоність океану —',['35‰','3,5‰','350‰'],0),Q('На припливи впливають',['Місяць і Сонце','лише вітер','лише опади'],0),Q('Течії переносять',['тепло','гірські породи','хмари'],0),Q('Світовий океан — це',['єдина водна оболонка','одне море','лише Тихий океан'],0),Q('Море — частина',['океану','атмосфери','літосфери'],0)])],
'Історія України':[
lesson('Київська держава за перших князів','Київська держава сформувалася у Східній Європі, а Київ став політичним і торговельним центром.',['Олег утвердився в Києві 882 року за літописною традицією.','Ольга здійснила податкові реформи; Святослав відомий воєнними походами.','Володимир Великий запровадив християнство як державну релігію 988 року.'],[Q('Коли Олег утвердився в Києві?',['882','988','1019'],0),Q('Хто запровадив християнство 988 року?',['Володимир Великий','Ярослав Мудрий','Святослав'],0),Q('Хто здійснив податкові реформи?',['Ольга','Анна','Роксолана'],0),Q('Святослав відомий',['воєнними походами','друкарством','реформою освіти'],0),Q('Київ був центром',['політики й торгівлі','океанського флоту','нафтовидобутку'],0)]),
lesson('Українська революція 1917–1921','Українська революція стала періодом боротьби за державність після падіння Російської імперії.',['Центральну Раду створено в березні 1917 року; її очолив Михайло Грушевський.','III Універсал проголосив УНР, IV Універсал у січні 1918 року — незалежність.','У 1918 році постала Українська Держава Павла Скоропадського.'],[Q('Коли створено Центральну Раду?',['Березень 1917','Січень 1918','Квітень 1918'],0),Q('Хто очолював Центральну Раду?',['Михайло Грушевський','Павло Скоропадський','Євген Петрушевич'],0),Q('Який Універсал проголосив незалежність?',['IV','I','II'],0),Q('Хто очолив Українську Державу 1918 року?',['Павло Скоропадський','Симон Петлюра','Грушевський'],0),Q('УНР — це',['Українська Народна Республіка','Українська Наукова Рада','Універсальна Національна Реформа'],0)]),
lesson('Україна у Другій світовій війні','Українські землі стали одним із головних театрів воєнних дій у Східній Європі в 1939–1945 роках.',['Німеччина напала на СРСР 22 червня 1941 року.','Вигнання нацистських військ з території України завершилося восени 1944 року.','Війна принесла величезні людські втрати, Голокост і руйнування.'],[Q('Коли Німеччина напала на СРСР?',['22 червня 1941','1 вересня 1939','9 травня 1945'],0),Q('Коли завершилося вигнання нацистських військ з України?',['1944','1941','1945'],0),Q('Голокост — це',['геноцид євреїв','економічна реформа','військовий союз'],0),Q('Друга світова почалася',['1939 року','1941 року','1945 року'],0),Q('Наслідок війни —',['масові людські втрати','відсутність руйнувань','зникнення історії'],0)]),
lesson('Незалежність України','Акт проголошення незалежності України ухвалено Верховною Радою 24 серпня 1991 року.',['1 грудня 1991 року відбувся всеукраїнський референдум на підтвердження незалежності.','Першим Президентом незалежної України став Леонід Кравчук.','Конституцію України ухвалено 28 червня 1996 року.'],[Q('Коли проголошено незалежність?',['24 серпня 1991','1 грудня 1991','28 червня 1996'],0),Q('Коли відбувся референдум?',['1 грудня 1991','24 серпня 1991','16 липня 1990'],0),Q('Перший Президент незалежної України —',['Леонід Кравчук','Леонід Кучма','Віктор Ющенко'],0),Q('Конституцію ухвалено',['1996 року','1991 року','2004 року'],0),Q('Державний символ —',['прапор','столиця','валюта'],0)])],
'Англійська мова':[
lesson('Present Simple','Present Simple використовують для звичок, регулярних дій і загальних фактів.',['I/you/we/they + base verb.','He/she/it + дієслово із закінченням -s/-es.','Заперечення: do not/does not + base verb; питання: Do/Does.'],[Q('She ___ to school every day.',['go','goes','going'],1),Q('They ___ football on Sundays.',['plays','play','playing'],1),Q('He does not ___ coffee.',['drinks','drink','drinking'],1),Q('___ you like music?',['Do','Does','Are'],0),Q('The sun ___ in the east.',['rise','rises','rising'],1)]),
lesson('Past Simple','Past Simple описує завершені дії в минулому.',['Правильні дієслова зазвичай мають -ed.','Неправильні: go—went, see—saw, have—had.','Заперечення й питання: did + початкова форма дієслова.'],[Q('Yesterday I ___ a film.',['watch','watched','watches'],1),Q('She ___ to London last year.',['go','went','goes'],1),Q('We did not ___ late.',['arrived','arrive','arrives'],1),Q('___ he call you?',['Did','Does','Was'],0),Q('Past form of “see” —',['saw','seen','seed'],0)]),
lesson('Future forms','Для майбутніх подій використовують will, be going to та Present Continuous у відповідних контекстах.',['Will часто виражає спонтанне рішення або прогноз.','Be going to — намір або прогноз на підставі ознак.','Present Continuous може позначати домовленість на майбутнє.'],[Q('I think it ___ rain tomorrow.',['will','did','is'],0),Q('We ___ visit grandma; we have a plan.',['are going to','was','did'],0),Q('She ___ meeting us at six.',['is','are','will be'],0),Q('“I’ll help you” — це',['спонтанне рішення','минула дія','звичка'],0),Q('They ___ flying on Friday.',['are','is','was'],0)]),
lesson('Reading strategies','Розуміння тексту починається з визначення теми, головної думки й контексту незнайомих слів.',['Спочатку перегляньте заголовок і перше речення абзацу.','Шукайте ключові слова, займенники та слова-зв’язки.','Не перекладайте кожне слово: визначайте значення з контексту.'],[Q('Main idea означає',['головна думка','приклад','заголовок'],0),Q('However виражає',['протиставлення','причину','час'],0),Q('Незнайоме слово допомагає зрозуміти',['контекст','кількість букв','алфавіт'],0),Q('Because означає',['тому що','однак','після'],0),Q('Спочатку корисно прочитати',['заголовок','лише останнє слово','примітки'],0)])],
'Українська література':[
lesson('Як аналізувати художній твір','Художній твір має тему, ідею, сюжет, композицію та систему образів.',['Тема — про що твір; ідея — основна думка автора.','Сюжет — перебіг подій; композиція — побудова твору.','Образ персонажа розкривають через вчинки, мовлення й авторську характеристику.'],[Q('Тема твору —',['про що твір','основна думка','порядок розділів'],0),Q('Ідея — це',['основна думка','місце подій','ім’я героя'],0),Q('Сюжет — це',['перебіг подій','опис автора','перелік персонажів'],0),Q('Композиція — це',['побудова твору','рима','жанр'],0),Q('Характер героя розкривають через',['вчинки й мовлення','обкладинку','кількість сторінок'],0)]),
lesson('Тропи та художні засоби','Художні засоби допомагають створювати образність і передавати емоції.',['Епітет — образне означення; порівняння зіставляє предмети.','Метафора переносить назву за подібністю; персоніфікація надає неживому людських рис.','Гіпербола — художнє перебільшення.'],[Q('Образне означення —',['епітет','сюжет','діалог'],0),Q('Приховане перенесення значення —',['метафора','рима','строфа'],0),Q('Надання неживому людських рис —',['персоніфікація','гіпербола','антитеза'],0),Q('Художнє перебільшення —',['гіпербола','епітет','порівняння'],0),Q('«Сміливий, мов лев» — це',['порівняння','метафора','персоніфікація'],0)]),
lesson('Роди й жанри літератури','Літературні твори традиційно поділяють на епос, лірику та драму.',['Епос розповідає про події та персонажів.','Лірика передає почуття й переживання ліричного героя.','Драма призначена для сценічного втілення; її основу складають діалоги й дії.'],[Q('Твір для сцени —',['драма','лірика','нарис'],0),Q('Передає почуття ліричного героя —',['лірика','епос','комедія'],0),Q('Розповідь про події характерна для',['епосу','лірики','ода'],0),Q('Роман належить переважно до',['епосу','драми','лірики'],0),Q('Діалог — це',['розмова персонажів','опис природи','перелік подій'],0)]),
lesson('Поезія: ритм і рима','Поетичний текст має ритмічну організацію, а рима створює звукову співзвучність рядків.',['Рима — співзвуччя закінчень рядків.','Ритм — закономірне чергування наголошених і ненаголошених складів.','Строфа — група віршових рядків, об’єднаних ритмом і римуванням.'],[Q('Співзвуччя закінчень рядків —',['рима','сюжет','тема'],0),Q('Група віршових рядків —',['строфа','абзац','розділ'],0),Q('Ритм — це',['чергування наголосів','назва автора','кількість сторінок'],0),Q('Ліричний герой —',['образ у поезії','реальний читач','видавець'],0),Q('Поезія найчастіше має',['віршову форму','лише таблиці','лише діалоги'],0)])]
};
const subjectsByGrade={'5 клас':['Українська мова','Українська література','Математика','Історія України','Географія','Біологія','Англійська мова','Інформатика'],'6 клас':['Українська мова','Українська література','Математика','Історія України','Географія','Біологія','Англійська мова','Інформатика'],'7 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика'],'8 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика'],'9 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика'],'10 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика'],'11 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика'],'12 клас':['Українська мова','Українська література','Алгебра','Геометрія','Історія України','Географія','Біологія','Хімія','Фізика','Англійська мова','Інформатика']};
const generic=['Практикум: розбір прикладів','Застосування знань','Повторення та самоперевірка'];
const fallback=(s,i)=>{if(s==='Математика')s='Алгебра';if(bank[s])return bank[s][i%bank[s].length];if(s==='Інформатика')return lesson('Алгоритми та програмування','Алгоритм — скінченна послідовність чітких команд для розв’язання задачі.',['Базові структури: слідування, розгалуження, повторення.','Змінна зберігає значення, яке може змінюватися.','Алгоритм має бути зрозумілим і скінченним.'],[Q('Алгоритм — це',['послідовність команд','випадковий набір','лише малюнок'],0),Q('Перевіряє умову',['розгалуження','слідування','виведення'],0),Q('Цикл потрібен для',['повторення','завершення монітора','друку'],0),Q('Змінна зберігає',['значення','зображення','заряд'],0),Q('Властивість алгоритму —',['скінченність','неоднозначність','випадковість'],0)]);return bank['Біологія'][i%4]};
const data={};for(const [g,subs] of Object.entries(subjectsByGrade)){data[g]={};for(const s of subs){let count=(s==='Алгебра'||s==='Геометрія'||s==='Хімія'||s==='Біологія'||s==='Географія')?5:4;data[g][s]=Array.from({length:count},(_,i)=>{let x=fallback(s,i);return {...x,title:x.title+(i>=Object.keys(bank).length?' · практика':'')}})}}
data['НМТ']={};['Українська мова','Алгебра','Геометрія','Історія України','Біологія','Хімія','Географія','Англійська мова'].forEach(s=>data['НМТ'][s]=(bank[s]||bank['Алгебра']).map(x=>({...x})));
// Remove experimental/laboratory practice topics from the catalog
for(const g of Object.keys(data)){for(const s of Object.keys(data[g])){data[g][s]=data[g][s].filter(t=>!/(експеримент|експеримент|дослід|лаборатор|практикум)/i.test(t.title));}}
let pro=localStorage.getItem('edu_pro')==='true',page='home',group='',subject='',idx=0,tab='rules',answers={},submitted=false;
function updatePro(){$('#pro').textContent=pro?'✓ PRO-доступ активовано':'🔑 Активувати повний доступ (PRO)';$('#pro').classList.toggle('active',pro)}
function activateModal(){
 let m=$('#modal');m.classList.remove('hidden');
 m.innerHTML=`<div class="modalwrap" style="background:#050916;z-index:99999"><div class="modal"><h2>🔒 Введіть одноразовий ключ доступу, отриманий у Telegram-боті</h2><p class="muted">Введіть ключ, щоб відкрити освітній простір.</p><input id="code" placeholder="Одноразовий ключ" autocomplete="off" autocapitalize="characters"><div id="msg" role="status" aria-live="polite" style="color:#ffd27b;min-height:25px"></div><button class="primary" id="activate" style="width:100%">Увійти</button></div></div>`;
 const activate=async()=>{const userCode=$('#code').value.trim().toUpperCase(),msg=$('#msg'),btn=$('#activate');if(!userCode){msg.textContent='Введіть ключ доступу.';return}btn.disabled=true;btn.textContent='Перевіряємо…';msg.textContent='Зачекайте, перевіряємо ключ на сервері.';
 try{const response=await fetch(API_URL + "/verify?code=" + encodeURIComponent(userCode),{method:'GET',headers:{'Accept':'application/json'}});let result;try{result=await response.json()}catch(e){throw new Error('Сервер повернув некоректну відповідь.')}if(result.ok===true){pro=true;localStorage.setItem('edu_pro','true');msg.style.color='#78e8c5';msg.textContent=result.message||'✅ Доступ підтверджено!';updatePro();setTimeout(()=>{m.classList.add('hidden');render()},350)}else{msg.style.color='#ff9aa9';msg.textContent=result.message||'❌ Неправильний або використаний ключ.';btn.disabled=false;btn.textContent='Увійти'}}catch(error){msg.style.color='#ff9aa9';msg.textContent='❌ Не вдалося зв’язатися із сервером. Перевір API_URL та підключення.';btn.disabled=false;btn.textContent='Спробувати ще раз'}};
 $('#activate').onclick=activate;$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')activate()});
}
$('#pro').onclick=activateModal;
function render(){updatePro();let main=$('#main');if(page==='home'){let total=Object.values(data).reduce((n,g)=>n+Object.values(g).reduce((a,l)=>a+l.length,0),0);main.innerHTML=`<section class="hero"><div class="eyebrow">Твоя онлайн-школа</div><h2>Вчися розуміти світ. 🚀</h2><p>Повноцінні уроки з поясненнями, прикладами, тестами та віртуальною хімічною лабораторією. Відкривай теми крок за кроком і навчайся у власному темпі.</p><div class="muted">📚 ${total} уроків у каталозі · 🧪 Віртуальна лабораторія · 📝 Тести з перевіркою</div></section><div class="heading"><h2>Обери клас</h2><small>5–12 класи</small></div><div class="grid">${Object.keys(subjectsByGrade).map((g,i)=>`<button class="card" data-group="${g}"><b>${i+5}</b><strong>${g}</strong><small>${Object.keys(data[g]).length} предметів · ${Object.values(data[g]).reduce((a,x)=>a+x.length,0)} уроків</small></button>`).join('')}</div><button class="nmt" data-group="НМТ"><strong>🎯 Підготовка до НМТ / ЗНО</strong><small>Українська, математика, історія, біологія, хімія, географія та англійська →</small></button>`;main.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{group=b.dataset.group;page='subjects';render()})}
else if(page==='subjects'){main.innerHTML=`<button class="back" id="back">← Головне меню</button><div class="crumb">${esc(group)}</div><div class="heading"><h2>${esc(group==='НМТ'?'Підготовка до НМТ / ЗНО':group)}</h2><small>Обери предмет</small></div><input class="search" id="search" placeholder="🔎 Знайти предмет"><div class="subjects" id="subjects">${Object.entries(data[group]).map(([s,l])=>`<button class="card subject" data-sub="${esc(s)}"><strong>${icons[s]||'📖'} ${esc(s)}</strong><small>${l.length} уроків · конспекти й тести</small></button>`).join('')}</div>`;$('#back').onclick=()=>{page='home';render()};$('#search').oninput=e=>$('#subjects').querySelectorAll('[data-sub]').forEach(b=>b.classList.toggle('hidden',!b.innerText.toLowerCase().includes(e.target.value.toLowerCase())));main.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{subject=b.dataset.sub;page='topics';render()})}
else if(page==='topics'){let list=data[group][subject];main.innerHTML=`<button class="back" id="back">← До предметів</button><div class="crumb">${esc(group)} / ${esc(subject)}</div><div class="heading"><h2>${icons[subject]||'📖'} ${esc(subject)}</h2><small>${list.length} уроків</small></div><input class="search" id="filter" placeholder="🔎 Знайти тему"><div class="topiclist" id="list">${list.map((t,i)=>{let locked=i>=2&&!pro;return `<button class="topic" data-i="${i}"><span><strong>${locked?'🔒 ':''}${esc(t.title)}</strong><small>${locked?'Потрібен PRO':'📖 Конспект · ✅ тест із 5 питань'}</small></span><span class="tag ${locked?'lock':''}">${locked?'PRO':'ВІДКРИТО'}</span></button>`}).join('')}</div>`;$('#back').onclick=()=>{page='subjects';render()};$('#filter').oninput=e=>$('#list').querySelectorAll('[data-i]').forEach(b=>b.classList.toggle('hidden',!b.innerText.toLowerCase().includes(e.target.value.toLowerCase())));main.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{idx=+b.dataset.i;if(idx>=2&&!pro){activateModal();return}tab='rules';answers={};submitted=false;page='lesson';render()})}
else lessonPage()}
function lab(){return `<section class="lab"><div class="eyebrow">Інтерактивна зона</div><h3>🧪 Віртуальна хімічна лабораторія</h3><p class="muted">Обирай навчальні моделі й спостерігай за анімацією. Це симуляція, а не інструкція для реального змішування речовин.</p><div class="labrow"><label>Модель A<select id="chemA"><option value="acid">Кисле середовище</option><option value="water">Вода</option><option value="base">Лужне середовище</option></select></label><label>Модель B<select id="chemB"><option value="base">Лужне середовище</option><option value="indicator">Індикатор</option><option value="water">Вода</option></select></label></div><div class="stage"><div class="beaker"><div class="liquid" id="liquid"></div><i class="bubble"></i><i class="bubble"></i><i class="bubble"></i></div></div><button class="primary" id="mix">▶ Змішати у симуляції</button><div class="result" id="result">Обери дві моделі й запусти віртуальний дослід.</div><small>Не використовуй сайт як інструкцію для дослідів із реальними реактивами. Реальні експерименти — лише з учителем.</small></section>`}
function wireLab(){$('#mix').onclick=()=>{let a=$('#chemA').value,b=$('#chemB').value,l=$('#liquid');l.style.height='75%';l.style.background=a==='acid'&&b==='base'?'#b28be8cc':(b==='indicator'?'#e77e9acc':'#65c6b9cc');$('#result').textContent=a==='acid'&&b==='base'?'🟣 Модель нейтралізації: кислота й основа можуть утворювати сіль і воду. Колір анімації умовний.':(b==='indicator'||a==='indicator'?'🎨 Модель індикатора: колір залежить від кислотності середовища (pH).':'💧 Модель змішування: спостерігай за зміною рівня та кольору рідини.')}} 
function lessonPage(){let t=data[group][subject][idx];$('#main').innerHTML=`<button class="back" id="back">← До тем</button><div class="crumb">${esc(group)} / ${esc(subject)}</div><h2>${esc(t.title)}</h2><div class="tabs"><button class="tab ${tab==='rules'?'active':''}" data-tab="rules">📖 Головні правила та конспект</button><button class="tab ${tab==='test'?'active':''}" data-tab="test">✅ Тест для перевірки</button></div><div id="content"></div>`;$('#back').onclick=()=>{page='topics';render()};$('#main').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;lessonPage()});let box=$('#content');if(tab==='rules'){box.innerHTML=`<section class="panel"><h3>📖 Конспект уроку</h3><p class="muted">${esc(t.desc)}</p>${t.rules.map((r,i)=>`<div class="rule"><b>${i+1}.</b> ${esc(r)}</div>`).join('')}<button class="primary" id="toTest">Перейти до тесту →</button></section>`;$('#toTest').onclick=()=>{tab='test';lessonPage()}}else{let done=Object.keys(answers).length,score=t.qs.reduce((n,q,i)=>n+(answers[i]===q[2]?1:0),0);box.innerHTML=`<section class="panel"><b>Тест: 5 запитань</b><span class="muted" style="float:right">${done}/5</span><div class="progress"><i style="width:${done*20}%"></i></div>${t.qs.map((q,i)=>`<div class="question"><h4>${i+1}. ${esc(q[0])}</h4>${q[1].map((a,j)=>`<button class="opt ${submitted&&j===q[2]?'correct':''} ${submitted&&answers[i]===j&&j!==q[2]?'wrong':''}" data-q="${i}" data-a="${j}" ${submitted||answers[i]!==undefined?'disabled':''}>${'АБВ'[j]}. ${esc(a)}</button>`).join('')}${submitted?`<small>${answers[i]===q[2]?'✓ Правильно':'✗ Неправильно'} · Правильна відповідь: ${esc(q[1][q[2]])}</small>${pro?`<div class=\"rule\"><b>Пояснення:</b> ${esc(t.rules[0])} ${esc(t.rules[1]||'')} Для обчислень: запиши умову, виконай потрібні дії за правилом і перевір результат.</div>`:''}`:''}</div>`).join('')}${submitted?`<div class="rule"><b style="font-size:24px">${score}/5 балів</b><br>${score===5?'Чудово!':score>=3?'Гарний результат. Повтори помилки.':'Перечитай конспект і спробуй ще раз.'}</div><button class="primary" id="retry">Пройти ще раз</button>`:`<button class="primary" id="check" ${done<5?'disabled style="opacity:.45"':''}>Перевірити відповіді</button>`}</section>`;box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{answers[+b.dataset.q]=+b.dataset.a;lessonPage()});if(!submitted)$('#check').onclick=()=>{submitted=true;lessonPage()};else $('#retry').onclick=()=>{answers={};submitted=false;lessonPage()}}}
if(pro){render()}else{activateModal();updatePro()}
})();
</script></body></html>
