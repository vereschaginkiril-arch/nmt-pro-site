<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Освітній простір PRO</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#0b1020;--p:#151f34;--p2:#1d2a45;--line:#2c3c5b;--t:#f3f6ff;--m:#aab8d2;--a:#8997ff;--g:#54d8b2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 10% 0,#202d50,transparent 38%),var(--bg);color:var(--t);font:16px/1.55 system-ui}
.app{max-width:1160px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{background:linear-gradient(135deg,#788cff,#b06cf5);border-radius:15px;padding:9px;font-size:25px}
.brand h1{font-size:19px;margin:0}
.muted,small{color:var(--m)}
button,input{font:inherit}
button{cursor:pointer}
.pro,.primary{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#788aff,#a16df2);color:white;font-weight:750}
.pro.active{background:linear-gradient(135deg,#1b9d7d,#51d4ac)}
.hero{padding:27px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(115deg,#202e51,#17243c);margin-bottom:20px}
.hero h2{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:8px 0}
.hero p{color:var(--m);max-width:700px}
.eyebrow{color:#b5c0ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.heading{display:flex;justify-content:space-between;align-items:end;margin:23px 0 12px}
.heading h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.topic,.panel{background:var(--p);border:1px solid var(--line);border-radius:19px}
.card{padding:16px;text-align:left;color:var(--t)}
.card b{font-size:28px;display:block}
.card:hover,.topic:hover{border-color:var(--a);transform:translateY(-2px)}
.nmt{width:100%;margin-top:13px;padding:20px;border:1px solid #6558bb;border-radius:20px;background:linear-gradient(110deg,#30265f,#1b2948);color:white;text-align:left}
.nmt strong{font-size:20px}
.nmt small{display:block}
.back{border:1px solid var(--line);background:var(--p);color:var(--t);padding:9px 13px;border-radius:12px}
.crumb{margin:10px 0;color:var(--m)}
.crumb button{background:none;border:0;color:#b9c5ff}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.subject{padding:18px;text-align:left;color:var(--t)}
.subject strong{display:block;font-size:18px}
.topiclist{display:grid;gap:9px}
.topic{width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--t)}
.tag{font-size:11px;padding:4px 8px;border-radius:30px;background:#203e39;color:#78e8c5}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab{border:1px solid var(--line);background:var(--p);color:var(--m);padding:10px 13px;border-radius:12px}
.tab.active{background:#2a365f;border-color:var(--a);color:white}
.panel{padding:20px;margin:12px 0}
.rule{padding:12px;margin:9px 0;background:var(--p2);border-left:3px solid var(--a);border-radius:0 12px 12px 0}
.question{padding:14px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#101a2d}
.question h4{margin:0 0 9px}
.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#1a2741;color:white}
.opt.correct{background:#174438;border-color:#35c99c}
.opt.wrong{background:#482632;border-color:#ff7d91}
.opt:disabled{opacity:1}
.progress{height:8px;background:#2b3852;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
.lockscreen{position:fixed;inset:0;background:#0b1020;display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(440px,100%);padding:26px;border-radius:22px;background:#151f34;border:1px solid #35466b;text-align:center}
.modal input{width:100%;padding:14px;margin:14px 0;background:#0b1020;color:white;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:18px;letter-spacing:1px}
.err{color:#ff7d91;font-size:14px;margin:8px 0;min-height:20px}
.hidden{display:none!important}
.footer{text-align:center;color:#7584a0;font-size:12px;margin:35px 0}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:16px}.pro{font-size:12px;padding:9px}.hero{padding:20px}.panel{padding:14px}}
</style>
</head>
<body>

<div id="lockscreen" class="lockscreen">
  <div class="modal">
    <div style="font-size:40px;margin-bottom:8px">🔒</div>
    <h2 style="margin:0 0 8px">Введіть одноразовий ключ доступу</h2>
    <p class="muted" style="margin:0">Отримайте ключ у нашому Telegram-боті та вставте його нижче, щоб відкрити всі класи та підготовку до НМТ.</p>
    <input id="codeInput" type="text" placeholder="NMT-0000-00" autocomplete="off">
    <div id="errMsg" class="err"></div>
    <button id="unlockBtn" type="button" class="primary" style="width:100%">Активувати доступ</button>
  </div>
</div>

<div id="app" class="app hidden">
  <header class="top">
    <div class="brand">
      <div class="logo">🎓</div>
      <div>
        <h1>Освітній простір</h1>
        <small>Повна версія PRO · 5–12 класи та НМТ</small>
      </div>
    </div>
    <span class="pro active">✅ PRO активовано</span>
  </header>
  <main id="main"></main>
  <div class="footer">Освітній простір · Вчися, досліджуй, відкривай нове</div>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0b1020'); } catch (e) {}
}

function unlockApp() {
  document.getElementById('lockscreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
}

if (localStorage.getItem('nmt_pro_unlocked') === 'true') {
  unlockApp();
}

document.getElementById('unlockBtn').addEventListener('click', function() {
  const raw = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('errMsg');
  const parts = raw.split('-');
  const used = JSON.parse(localStorage.getItem('used_nmt_codes') || '[]');

  if (used.indexOf(raw) !== -1) {
    err.textContent = '⚠️ Цей одноразовий код вже було використано!';
    return;
  }

  if (parts.length === 3 && parts[0] === 'NMT') {
    const num = parseInt(parts[1], 10);
    const check = parseInt(parts[2], 10);
    if (!isNaN(num) && num >= 1000 && num <= 9999 && check === ((num * 7 + 13) % 89 + 10)) {
      used.push(raw);
      localStorage.setItem('used_nmt_codes', JSON.stringify(used));
      localStorage.setItem('nmt_pro_unlocked', 'true');
      unlockApp();
      return;
    }
  }
  err.textContent = '❌ Невірний код доступу. Перевірте символи або отримайте новий код у боті.';
});

const icons = {
  'Українська мова': '📘',
  'Алгебра': '📐',
  'Історія України': '🏛️',
  'Англійська мова': '🌍'
};

      rules: [
        'Є шість голосних звуків: [а], [о], [у], [е], [и], [і].',
        'Приголосні розрізняють за дзвінкістю, глухістю, твердістю та м’якістю.',
        'Я, ю, є можуть позначати два звуки на початку слова, після голосного, апострофа або м’якого знака.'
      ],
      qs: [
        { q: 'Скільки букв в українській абетці?', opts: ['31', '32', '33'], ans: 2 },
        { q: 'Скільки голосних звуків?', opts: ['6', '10', '12'], ans: 0 },
        { q: 'Звук — одиниця', opts: ['усного мовлення', 'письма', 'абзацу'], ans: 0 }
      ]
    },
    {
      title: 'Наголоси НМТ',
      desc: 'Слова з нормативним наголосом, які найчастіше перевіряють на тестуванні.',
      rules: [
        'о́лень, ру́сло, спи́на, ви́падок, фо́льга — наголос на першому складі.',
        'завда́ння, чита́ння, пізна́ння, нови́й, тексто́вий — наголос на другому складі.',
        'катало́г, моноло́г, діало́г, кварта́л — наголос на останньому складі.'
      ],
      qs: [
        { q: 'Де правильно виділено наголос?', opts: ['олЕнь', 'Олень', 'оленЬ'], ans: 1 },
        { q: 'Як правильно наголосити?', opts: ['випАдок', 'вИпадок', 'випадОк'], ans: 1 },
        { q: 'Оберіть правильний варіант:', opts: ['завдАння', 'зАвдання', 'завданнЯ'], ans: 0 }
      ]
    }
  ],
  'Алгебра': [
    {
      title: 'Лінійні рівняння',
      desc: 'Рівняння виду ax = b, де x — невідома змінна.',
      rules: [

        'Обидві частини рівняння можна множити або ділити на одне й те саме число, відмінне від нуля.'
      ],

    {

      rules: [
        '988 рік — запровадження християнства як державної релігії Володимиром Великим.',
