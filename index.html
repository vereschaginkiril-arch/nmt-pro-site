<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Освітній простір PRO</title>
<script src="https://telegram.org"></script>
<style>
:root{--bg:#0b1020;--p:#151f34;--p2:#1d2a45;--line:#2c3c5b;--t:#f3f6ff;--m:#aab8d2;--a:#8997ff;--g:#54d8b2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 10% 0,#202d50,transparent 38%),var(--bg);color:var(--t);font:16px/1.55 system-ui}
.app{max-width:1160px;margin:auto;padding:16px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.brand{display:flex;gap:12px;align-items:center}
.logo{background:linear-gradient(135deg,#788cff,#b06cf5);border-radius:15px;padding:9px;font-size:25px}
.brand h1{font-size:19px;margin:0}
.muted,small{color:var(--m)}
button,input,select{font:inherit}
button{cursor:pointer}
.pro,.primary{border:0;border-radius:13px;padding:11px 16px;background:linear-gradient(135deg,#788aff,#a16df2);color:white;font-weight:750}
.pro.active{background:linear-gradient(135deg,#1b9d7d,#51d4ac)}
.hero{padding:27px;border:1px solid var(--line);border-radius:25px;background:linear-gradient(115deg,#202e51,#17243c);margin-bottom:20px}
.hero h2{font-size:clamp(28px,5vw,42px);line-height:1.12;margin:8px 0}
.hero p{color:var(--m);max-width:700px}
.eyebrow{color:#b5c0ff;font-size:12px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.heading{display:flex;justify-content:space-between;align-items:end;margin:23px 0 12px}
.heading h2{margin:0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card,.topic,.panel{background:var(--p);border:1px solid var(--line);border-radius:19px}
.card{padding:16px;text-align:left;color:var(--t)}
.card b{font-size:28px;display:block}
.card:hover,.topic:hover{border-color:var(--a);transform:translateY(-2px)}
.nmt{width:100%;margin-top:13px;padding:20px;border:1px solid #6558bb;border-radius:20px;background:linear-gradient(110deg,#30265f,#1b2948);color:white;text-align:left}
.nmt strong{font-size:20px}
.nmt small{display:block}
.back{border:1px solid var(--line);background:var(--p);color:var(--t);padding:9px 13px;border-radius:12px}
.crumb{margin:10px 0;color:var(--m)}
.crumb button{background:none;border:0;color:#b9c5ff}
.subjects{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.subject{padding:18px;text-align:left;color:var(--t)}
.subject strong{display:block;font-size:18px}
.topiclist{display:grid;gap:9px}
.topic{width:100%;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;color:var(--t)}
.tag{font-size:11px;padding:4px 8px;border-radius:30px;background:#203e39;color:#78e8c5}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
.tab{border:1px solid var(--line);background:var(--p);color:var(--m);padding:10px 13px;border-radius:12px}
.tab.active{background:#2a365f;border-color:var(--a);color:white}
.panel{padding:20px;margin:12px 0}
.rule{padding:12px;margin:9px 0;background:var(--p2);border-left:3px solid var(--a);border-radius:0 12px 12px 0}
.question{padding:14px;border:1px solid var(--line);border-radius:14px;margin:12px 0;background:#101a2d}
.question h4{margin:0 0 9px}
.opt{display:block;width:100%;text-align:left;padding:10px;margin:6px 0;border:1px solid var(--line);border-radius:10px;background:#1a2741;color:white}
.opt.correct{background:#174438;border-color:#35c99c}
.opt.wrong{background:#482632;border-color:#ff7d91}
.opt:disabled{opacity:1}
.progress{height:8px;background:#2b3852;border-radius:20px;overflow:hidden}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--g))}
.search{width:100%;padding:12px;background:#111c30;color:white;border:1px solid var(--line);border-radius:12px;margin:12px 0}
.lab{padding:18px;margin-top:18px;background:#14243a;border:1px solid #36506d;border-radius:20px}
.lab select{width:100%;padding:10px;background:#0d192b;color:white;border:1px solid var(--line);border-radius:10px}
.labrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stage{height:170px;display:grid;place-items:center;margin:12px 0;border-radius:14px;background:radial-gradient(circle,#294b69,#0b1729)}
.beaker{height:110px;width:80px;border:3px solid #a9d6ef;border-top:0;border-radius:4px 4px 20px 20px;position:relative;overflow:hidden}
.liquid{position:absolute;bottom:0;width:100%;height:50%;background:#65a9e0aa;transition:.6s}
.bubble{position:absolute;bottom:5px;left:20px;width:9px;height:9px;border:1px solid white;border-radius:50%;animation:rise 1.5s infinite}
.bubble:nth-child(2){left:48px;animation-delay:.5s}
.bubble:nth-child(3){left:35px;animation-delay:1s}
@keyframes rise{to{transform:translateY(-100px);opacity:0}}
.result{min-height:40px;color:#b9d9ff}
.modalwrap{position:fixed;inset:0;background:#050916f2;display:grid;place-items:center;padding:18px;z-index:50}
.modal{width:min(440px,100%);padding:26px;border-radius:22px;background:#18243c;border:1px solid #465474;text-align:center}
.modal input{width:100%;padding:14px;margin:12px 0;background:#0e1729;color:white;border:1px solid var(--line);border-radius:12px;text-align:center;font-size:18px;letter-spacing:1px}
.status{min-height:22px;font-size:14px;margin:8px 0;color:#ff8ea1}
.hidden{display:none!important}
.footer{text-align:center;color:#7584a0;font-size:12px;margin:35px 0}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.subjects{grid-template-columns:1fr}.top{align-items:flex-start}.brand h1{font-size:16px}.pro{font-size:12px;padding:9px}.hero{padding:20px}.panel{padding:14px}}
</style>
</head>
<body>

<div id="lockScreen" class="modalwrap">
  <div class="modal">
    <div style="font-size:40px;margin-bottom:8px">🔒</div>
    <h2 style="margin:0 0 8px">Введіть одноразовий ключ доступу</h2>
    <p class="muted" style="margin:0">Отримайте ключ у Telegram-боті та вставте його нижче, щоб відкрити повний доступ PRO.</p>
    <input id="codeInput" type="text" placeholder="NMT-XXXX-XXXX" autocomplete="off">
    <div id="codeStatus" class="status"></div>
    <button id="activateBtn" type="button" class="primary" style="width:100%">Активувати доступ</button>
  </div>
</div>

<div id="appWrap" class="app hidden">
  <header class="top">
    <div class="brand">
      <div class="logo">🎓</div>
      <div>
        <h1>Освітній простір</h1>
        <small>Повна версія PRO · 5–11 класи та НМТ</small>
      </div>
    </div>
    <span class="pro active">✅ PRO активовано</span>
  </header>
  <main id="main"></main>
  <div class="footer">Освітній простір · Вчися, досліджуй, відкривай нове</div>
</div>

<script>
const API_URL = "https://onrender.com";
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  try { tg.setHeaderColor('#0b1020'); } catch (e) {}
}

function openProSpace() {
  document.getElementById('lockScreen').classList.add('hidden');
  document.getElementById('appWrap').classList.remove('hidden');
  render();
}

if (localStorage.getItem('nmt_pro_unlocked') === 'true') {
  openProSpace();
}

document.getElementById('activateBtn').addEventListener('click', async function() {
  const input = document.getElementById('codeInput');
  const statusEl = document.getElementById('codeStatus');
  const btn = document.getElementById('activateBtn');
  const userCode = input.value.trim().toUpperCase();

  if (!userCode) {
    statusEl.textContent = '⚠️ Введіть код доступу з бота.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Перевірка коду...';
  statusEl.style.color = '#aab8d2';
  statusEl.textContent = 'З’єднуємося із сервером (якщо сервер спав, зачекайте до 30 сек)...';

  try {
    const res = await fetch(API_URL + '/verify?code=' + encodeURIComponent(userCode));
    const data = await res.json();
    if (data.ok) {
      localStorage.setItem('nmt_pro_unlocked', 'true');
      openProSpace();
      return;
    } else {
      statusEl.style.color = '#ff8ea1';
      statusEl.textContent = data.message || '❌ Невірний або вже використаний код!';
    }
  } catch (err) {
    statusEl.style.color = '#ff8ea1';
    statusEl.textContent = '❌ Помилка зв’язку із сервером. Спробуйте натиснути ще раз через 5 секунд.';
  }

  btn.disabled = false;
  btn.textContent = 'Активувати доступ';
});

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

const icons = {
  'Українська мова': '📘',
  'Українська література': '📚',
  'Алгебра': '📐',
  'Геометрія': '📏',
  'Історія України': '🏛️',
  'Англійська мова': '🌍',
  'Біологія': '🧬',
  'Хімія': '⚗️',
  'Географія': '🌎',
  'Фізика': '⚡',
  'Інформатика': '💻'
};

function makeLesson(title, desc, rulesStr, qsList) {
  return { title: title, desc: desc, rules: rulesStr.split('||'), qs: qsList };
}

function makeQ(q, optsStr, ans) {
  return { q: q, opts: optsStr.split('|'), ans: ans };
}

const bank = {
  'Українська мова': Array.of(
    makeLesson('Звуки й букви', 'Звук — найменша одиниця усного мовлення, буква — знак для позначення звука.', 'Є шість голосних звуків: а, о, у, е, и, і.||Приголосні розрізняють за дзвінкістю, глухістю, твердістю та м’якістю.||Я, ю, є позначають два звуки на початку слова, після голосного, апострофа або м’якого знака.', Array.of(
      makeQ('Скільки букв в українській абетці?', '31|32|33', 2),
      makeQ('Скільки голосних звуків в українській мові?', '6|10|12', 0),
      makeQ('Яка буква може позначати два звуки?', 'я|ь|і', 0)
    )),
    makeLesson('Наголоси НМТ', 'Слова з нормативним наголосом, які найчастіше трапляються на тестуванні.', 'На 1-й склад: о́лень, ру́сло, спи́на, ви́падок, фо́льга.||На 2-й склад: завда́ння, чита́ння, нови́й, тексто́вий.||На останній склад: катало́г, моноло́г, діало́г, кварта́л.', Array.of(
      makeQ('Де правильно виділено наголос?', 'олЕнь|Олень|оленЬ', 1),
